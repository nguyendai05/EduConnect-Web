<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;none&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Ví Edu Connect — Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}"/>
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}"/>
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}"/>
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}"/>
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}"/>
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}"/>
<link rel="stylesheet" href="/css/components/data-display/card.css" th:href="@{/css/components/data-display/card.css}"/>
<link rel="stylesheet" href="/css/components/data-display/info-row.css" th:href="@{/css/components/data-display/info-row.css}"/>
<link rel="stylesheet" href="/css/components/data-display/table.css" th:href="@{/css/components/data-display/table.css}"/>
<link rel="stylesheet" href="/css/components/navigation/pagination.css" th:href="@{/css/components/navigation/pagination.css}"/>
<link rel="stylesheet" href="/css/pages/contract/confirm.css" th:href="@{/css/pages/contract/confirm.css}"/>
<link rel="stylesheet" href="/css/pages/wallet/overview.css" th:href="@{/css/pages/wallet/overview.css}"/>
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
</th:block>
<th:block th:fragment="scripts">
<script src="/js/pages/wallet/overview.js" defer th:src="@{/js/pages/wallet/overview.js}"></script>
</th:block>
</head>
<body th:fragment="content">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v1')}"></th:block>
<main class="confirm-page">
    <header class="page-header"><div class="page-header__title-block">
        <h1 class="page-header__title">Ví Edu Connect</h1>
        <p class="confirm-muted">Số dư và lịch sử tiền vào, tiền ra của bạn.</p>
    </div></header>
    <section class="card" th:if="${wallet != null}"><div class="card__body confirm-stack">
        <div class="wallet-balances">
            <div class="confirm-price"><span>Số dư khả dụng</span><strong th:text="${#numbers.formatDecimal(wallet.balance, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></div>
            <div class="confirm-price" th:if="${wallet.secondLabel != null}"><span th:text="${wallet.secondLabel}"></span><strong th:text="${#numbers.formatDecimal(wallet.secondAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></div>
        </div>
        <p class="confirm-muted" th:if="${wallet.secondHint != null}" th:text="${wallet.secondHint}"></p>
    </div></section>
    <section class="card" th:if="${wallet != null and wallet.entries.empty}"><div class="card__body">
        <p class="confirm-muted">Chưa có giao dịch nào trong ví.</p>
    </div></section>
    <section class="card" th:if="${wallet != null and !wallet.entries.empty}"><div class="card__body confirm-stack">
        <h2 class="card__title">Lịch sử giao dịch</h2>
        <div class="table-wrapper table-wrapper--flat" role="region" aria-label="Lịch sử giao dịch ví" tabindex="0">
            <table class="table">
                <thead><tr><th scope="col">Thời gian</th><th scope="col">Loại</th><th scope="col">Nội dung</th><th scope="col">Số tiền</th></tr></thead>
                <tbody>
                    <tr th:each="e : ${wallet.entries.content}">
                        <td th:text="${#temporals.format(e.postedAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${e.kindLabel}"></td>
                        <td th:text="${e.memo}"></td>
                        <td class="table__amount" th:text="${(e.amount.signum() > 0 ? '+' : '') + #numbers.formatDecimal(e.amount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination pagination--table" aria-label="Phân trang lịch sử ví" th:if="${wallet.entries.totalPages > 1}">
            <p class="pagination__summary">Trang <strong th:text="${wallet.entries.number + 1}"></strong> / <strong th:text="${wallet.entries.totalPages}"></strong></p>
            <div class="pagination__controls">
                <a class="pagination__button pagination__button--wide" th:if="${wallet.entries.hasPrevious()}" th:href="@{/wallet/overview(page=${wallet.entries.number - 1})}">Trước</a>
                <a class="pagination__button pagination__button--wide" th:if="${wallet.entries.hasNext()}" th:href="@{/wallet/overview(page=${wallet.entries.number + 1})}">Sau</a>
            </div>
        </nav>
    </div></section>
</main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
