<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;none&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Tin nhắn — Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}"/>
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}"/>
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}"/>
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}"/>
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}"/>
<link rel="stylesheet" href="/css/components/feedback/empty-state.css" th:href="@{/css/components/feedback/empty-state.css}"/>
<link rel="stylesheet" href="/css/pages/chat/messages.css" th:href="@{/css/pages/chat/messages.css}"/>
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
</th:block>
<th:block th:fragment="scripts">
<script src="/js/pages/chat/messages.js" defer th:src="@{/js/pages/chat/messages.js}"></script>
</th:block>
</head>
<body th:fragment="content">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v1')}"></th:block>
<main class="chat-page">
    <header class="page-header"><div class="page-header__title-block">
        <h1 class="page-header__title">Tin nhắn</h1>
        <p class="chat-muted">Trao đổi giá, lịch học với gia sư trước khi gửi lời mời và chốt hợp đồng.</p>
    </div></header>
    <p class="alert alert--error" role="alert" th:if="${error != null}" th:text="${error}"></p>
    <section class="empty-state" th:if="${conversations == null or conversations.empty}">
        <h2 class="empty-state__title">Chưa có cuộc trò chuyện nào</h2>
        <p class="empty-state__description">Học viên có thể bắt đầu từ hồ sơ của gia sư (nút "Nhắn tin").</p>
    </section>
    <div class="chat-layout" th:if="${conversations != null and !conversations.empty}">
        <nav class="chat-list" aria-label="Cuộc trò chuyện">
            <a class="chat-list__item" th:each="c : ${conversations}"
               th:classappend="${current != null and current.id == c.id} ? 'is-active'"
               th:href="@{/chat/messages(conversation=${c.id})}" th:text="${c.otherName}"></a>
        </nav>
        <section class="chat-thread" th:if="${current != null}"
                 th:attr="data-chat-poll=@{/chat/poll(conversation=${current.id})},data-last-id=${chatMessages.empty ? 0 : chatMessages[chatMessages.size() - 1].id}">
            <header class="chat-thread__header">
                <h2 th:text="${current.otherName}"></h2>
                <a class="button button--primary button--small" th:if="${current.viewerIsLearner}"
                   th:href="@{/invitation/create(tutorId=${current.tutorId})}">Gửi lời mời</a>
            </header>
            <div class="chat-thread__messages" data-chat-messages>
                <p class="chat-muted" th:if="${chatMessages.empty}" data-chat-empty>Hãy gửi tin nhắn đầu tiên.</p>
                <div class="chat-msg" th:each="m : ${chatMessages}" th:classappend="${m.mine} ? 'chat-msg--mine'">
                    <p class="chat-msg__body" th:text="${m.body}"></p>
                    <time class="chat-msg__time" th:text="${#temporals.format(m.sentAt, 'dd/MM HH:mm')}"></time>
                </div>
            </div>
            <form class="chat-thread__form" method="post" th:action="@{/chat/send}">
                <input type="hidden" name="conversation" th:value="${current.id}">
                <textarea name="body" rows="2" maxlength="1000" required placeholder="Nhập tin nhắn…" aria-label="Nội dung tin nhắn"></textarea>
                <button class="button button--primary" type="submit">Gửi</button>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
