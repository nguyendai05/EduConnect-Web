<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: page(~{::title}, &#x27;/admin/job-review-queue&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Chi tiết duyệt tin tìm gia sư | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/utilities.css" th:href="@{/css/utilities.css}">
<link rel="stylesheet" href="/css/components/layout/admin-sidebar.css" th:href="@{/css/components/layout/admin-sidebar.css}">
<link rel="stylesheet" href="/css/components/layout/admin-header.css" th:href="@{/css/components/layout/admin-header.css}">
<link rel="stylesheet" href="/css/components/navigation/breadcrumb.css" th:href="@{/css/components/navigation/breadcrumb.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/data-display/card.css" th:href="@{/css/components/data-display/card.css}">
<link rel="stylesheet" href="/css/components/data-display/avatar.css" th:href="@{/css/components/data-display/avatar.css}">
<link rel="stylesheet" href="/css/components/data-display/info-row.css" th:href="@{/css/components/data-display/info-row.css}">
<link rel="stylesheet" href="/css/components/form/textarea.css" th:href="@{/css/components/form/textarea.css}">
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/components/feedback/modal.css" th:href="@{/css/components/feedback/modal.css}">
<link rel="stylesheet" href="/css/components/feedback/toast.css" th:href="@{/css/components/feedback/toast.css}">
<link rel="stylesheet" href="/css/components/feedback/empty-state.css" th:href="@{/css/components/feedback/empty-state.css}">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/pages/admin/job-review-detail.css" th:href="@{/css/pages/admin/job-review-detail.css}">
<link rel="stylesheet" th:href="@{/css/pages/job/live.css}">
<link rel="stylesheet" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" th:href="@{/css/components/form/form-field.css}">
</th:block>
<th:block th:fragment="headScripts">

</th:block>
<th:block th:fragment="scripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/admin-sidebar.js" defer th:src="@{/js/core/admin-sidebar.js}"></script>
<script src="/js/core/admin-header.js" defer th:src="@{/js/core/admin-header.js}"></script>
<script src="/js/pages/admin/job-review-detail.js" defer th:src="@{/js/pages/admin/job-review-detail.js}"></script>
</th:block>
</head>
<body th:fragment="content"><div class="admin-shell">
<th:block th:replace="~{fragments/sidebar-admin :: sidebar(${active}, 'v1')}"></th:block>
<th:block th:replace="~{fragments/header-admin :: header(${active}, 'v3')}"></th:block>
<main class="admin-shell__workspace"><div class="admin-shell__content job-live"><th:block th:replace="~{pages/job/fragments :: messages}"></th:block><a class="button button--outline" th:href="@{/admin/job-review-queue}">Về hàng đợi duyệt tin</a>
<th:block th:if="${job != null}"><div class="job-live-layout"><div class="job-live-stack">
  <th:block th:replace="~{pages/job/fragments :: summary(${job})}"></th:block>
  <th:block th:replace="~{pages/job/fragments :: selection(${job})}"></th:block>
</div><aside class="card job-live-panel"><h2>Quyết định duyệt tin</h2>
  <section class="job-live-stack" th:if="${decision != null}"><strong th:text="${decision.action == 'approve' ? 'Quyết định gần nhất: phê duyệt' : 'Quyết định gần nhất: từ chối'}"></strong><p class="job-live-copy" th:text="${decision.reason}"></p><p class="job-live-muted" th:text="|Admin #${decision.actorId} · phiên bản tin ${decision.resultingVersion}|"></p></section>
  <form class="job-live-stack" method="post" th:if="${job.status.name() == 'PENDING' and reviewRequest != null}" th:action="@{/admin/job-review-detail(id=${job.id})}" data-job-live-form>
    <input type="hidden" name="version" th:value="${job.version}">
    <label class="form-field">Lý do quyết định<textarea class="textarea-control" name="reason" th:text="${reviewRequest.reason}" rows="8" maxlength="2000" required></textarea></label>
    <button class="button button--primary" name="action" value="approve" type="submit">Phê duyệt và công khai</button><button class="button button--outline" name="action" value="reject" type="submit">Từ chối duyệt</button>
  </form>
  <p class="job-live-muted" th:if="${job.status.name() != 'PENDING'}">Tin không ở trạng thái chờ duyệt. Muốn xử lý tin khác, quay về hàng đợi.</p>
</aside></div></th:block></div></main></div></body></html>
