<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: page(~{::title}, &#x27;/admin/tutor-review-queue&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Hàng đợi duyệt gia sư | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/utilities.css" th:href="@{/css/utilities.css}">
<link rel="stylesheet" href="/css/components/layout/admin-sidebar.css" th:href="@{/css/components/layout/admin-sidebar.css}">
<link rel="stylesheet" href="/css/components/layout/admin-header.css" th:href="@{/css/components/layout/admin-header.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/form/input.css" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/pages/profile/live.css" th:href="@{/css/pages/profile/live.css}">
</th:block>
<th:block th:fragment="headScripts">

</th:block>
<th:block th:fragment="scripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/pages/admin/tutor-review-queue.js" defer th:src="@{/js/pages/admin/tutor-review-queue.js}"></script>
</th:block>
</head>
<body class="tutor-review-queue-page" th:fragment="content"><div class="admin-shell">
<th:block th:replace="~{fragments/sidebar-admin :: sidebar(${active}, 'v1')}"></th:block>
<th:block th:replace="~{fragments/header-admin :: header(${active}, 'v3')}"></th:block>
<main class="admin-shell__workspace"><div class="admin-shell__content pl">
    <h1 class="sr-only">Hàng đợi duyệt gia sư</h1>
    <section class="pl-messages" aria-live="polite">
        <div class="alert alert--error" role="alert" th:if="${pageError != null}"><p th:text="${pageError}"></p></div>
    </section>

    <th:block th:if="${queue != null}">
    <nav class="pl-tabs" aria-label="Lọc theo trạng thái">
        <a th:href="@{/admin/tutor-review-queue(status='PENDING',q=${q})}" th:attr="aria-current=${status.name() == 'PENDING' ? 'page' : null}">Chờ duyệt <span class="badge badge--warning" th:text="${queue.count(T(com.educonnect.tutor.domain.TutorReviewStatus).PENDING)}">0</span></a>
        <a th:href="@{/admin/tutor-review-queue(status='APPROVED',q=${q})}" th:attr="aria-current=${status.name() == 'APPROVED' ? 'page' : null}">Đã duyệt <span class="badge badge--success" th:text="${queue.count(T(com.educonnect.tutor.domain.TutorReviewStatus).APPROVED)}">0</span></a>
        <a th:href="@{/admin/tutor-review-queue(status='REJECTED',q=${q})}" th:attr="aria-current=${status.name() == 'REJECTED' ? 'page' : null}">Đã từ chối <span class="badge badge--danger" th:text="${queue.count(T(com.educonnect.tutor.domain.TutorReviewStatus).REJECTED)}">0</span></a>
        <a th:href="@{/admin/tutor-review-queue(status='DRAFT',q=${q})}" th:attr="aria-current=${status.name() == 'DRAFT' ? 'page' : null}">Bản nháp <span class="badge badge--neutral" th:text="${queue.count(T(com.educonnect.tutor.domain.TutorReviewStatus).DRAFT)}">0</span></a>
    </nav>

    <form class="pl-search" method="get" th:action="@{/admin/tutor-review-queue}">
        <input type="hidden" name="status" th:value="${status.name()}">
        <div class="pl-field">
            <label for="queue-q">Tìm theo tên, email hoặc tiêu đề</label>
            <span class="input-control"><input class="input-control__input" id="queue-q" name="q" type="search" maxlength="100" th:value="${q}"></span>
        </div>
        <button class="button button--primary" type="submit">Tìm</button>
    </form>

    <p class="pl-card" th:if="${queue.rows.isEmpty()}" th:text="${q.isEmpty() ? 'Không có hồ sơ nào ở trạng thái này.' : 'Không có hồ sơ nào khớp từ khóa.'}">Trống</p>

    <div class="pl-queue" th:unless="${queue.rows.isEmpty()}">
        <article class="pl-row" th:each="row : ${queue.rows}">
            <div>
                <h2><a th:href="@{/admin/tutor-review-detail(id=${row.userId})}" th:text="${row.name}">Tên</a></h2>
                <p class="pl-muted" th:text="${row.email}">email</p>
                <p th:text="${row.headline.isEmpty() ? '(Chưa có tiêu đề)' : row.headline}">Tiêu đề</p>
                <p class="pl-muted" th:text="${(row.subjects == null ? 'Chưa chọn môn' : row.subjects) + ' · ' + row.experienceYears + ' năm kinh nghiệm · ' + row.evidenceCount + ' minh chứng · cập nhật ' + row.updatedLabel() + ' (UTC+7)'}"></p>
            </div>
            <a class="button button--outline" th:href="@{/admin/tutor-review-detail(id=${row.userId})}" th:text="${row.status.name() == 'PENDING' ? 'Xem và duyệt' : 'Xem hồ sơ'}">Xem</a>
        </article>
    </div>

    <nav class="pl-nav" aria-label="Phân trang" th:unless="${queue.rows.isEmpty() and queue.page == 0}">
        <a class="button button--outline" th:if="${queue.hasPrevious()}" th:href="@{/admin/tutor-review-queue(status=${status.name()},q=${q},page=${queue.page - 1})}">Trang trước</a>
        <span th:text="${'Trang ' + (queue.page + 1) + ' / ' + queue.totalPages() + ' · ' + queue.total + ' hồ sơ'}"></span>
        <a class="button button--outline" th:if="${queue.hasNext()}" th:href="@{/admin/tutor-review-queue(status=${status.name()},q=${q},page=${queue.page + 1})}">Trang sau</a>
    </nav>
    </th:block>
</div></main></div>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
