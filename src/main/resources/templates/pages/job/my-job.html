<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;requests&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Tin tìm gia sư của tôi | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}">
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}">
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}">
<link rel="stylesheet" href="/css/components/navigation/tabs.css" th:href="@{/css/components/navigation/tabs.css}">
<link rel="stylesheet" href="/css/components/form/search-input.css" th:href="@{/css/components/form/search-input.css}">
<link rel="stylesheet" href="/css/components/form/select.css" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" href="/css/components/domain/job/job-card.css" th:href="@{/css/components/domain/job/job-card.css}">
<link rel="stylesheet" href="/css/components/domain/job/applicant-card.css" th:href="@{/css/components/domain/job/applicant-card.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/components/feedback/modal.css" th:href="@{/css/components/feedback/modal.css}">
<link rel="stylesheet" href="/css/components/feedback/empty-state.css" th:href="@{/css/components/feedback/empty-state.css}">
<link rel="stylesheet" href="/css/pages/job/my-job.css" th:href="@{/css/pages/job/my-job.css}">
<link rel="stylesheet" th:href="@{/css/components/data-display/card.css}">
<link rel="stylesheet" th:href="@{/css/pages/job/live.css}">
<link rel="stylesheet" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" th:href="@{/css/components/form/form-field.css}">
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
<script src="/js/pages/job/my-job.js" defer th:src="@{/js/pages/job/my-job.js}"></script>
</th:block>
<th:block th:fragment="scripts">

</th:block>
</head>
<body th:fragment="content"><div class="user-shell">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v9')}"></th:block>
<main class="user-shell__main"><div class="user-shell__content job-live"><th:block th:replace="~{pages/job/fragments :: navigation}"></th:block><th:block th:replace="~{pages/job/fragments :: messages}"></th:block><h1>Tin tìm gia sư của tôi</h1>
<form class="card job-live-panel" method="get" th:action="@{/job/my-job}" th:if="${search != null}">
  <div class="job-live-grid"><label class="form-field">Từ khóa<span class="input-control"><input class="input-control__input" name="q" th:value="${search.q}" maxlength="200"></span></label>
  <label class="form-field">Trạng thái<select class="select-control select-control--native" name="status"><option value="">Tất cả</option><option value="DRAFT" th:selected="${selectedStatus != null and selectedStatus.name() == 'DRAFT'}">Bản nháp</option><option value="PENDING" th:selected="${selectedStatus != null and selectedStatus.name() == 'PENDING'}">Chờ duyệt</option><option value="OPEN" th:selected="${selectedStatus != null and selectedStatus.name() == 'OPEN'}">Đang nhận ứng tuyển</option><option value="MATCHED" th:selected="${selectedStatus != null and selectedStatus.name() == 'MATCHED'}">Đã chọn gia sư</option><option value="CLOSED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CLOSED'}">Đã đóng</option><option value="REJECTED" th:selected="${selectedStatus != null and selectedStatus.name() == 'REJECTED'}">Bị từ chối</option></select></label></div>
  <button class="button button--primary" type="submit">Lọc tin</button>
</form><p class="card job-live-panel" th:if="${jobs != null and jobs.empty}">Chưa có tin phù hợp.</p>
    <div class="job-live-list" th:if="${jobs != null}">
      <article class="card job-live-panel" th:each="item : ${jobs.content}">
        <div class="job-live-heading"><span class="badge badge--info" th:text="${item.statusLabel}"></span><small th:text="${item.publicCode}"></small></div>
        <h2><a th:href="@{/job/detail(id=${item.id})}" th:text="${item.title}"></a></h2>
        <p th:text="|${item.subject} · ${item.grade} · ${item.area} · ${item.deliveryMode}|"></p>
        <p><strong th:text="${#numbers.formatDecimal(item.budgetPerSession, 0, 'POINT', 0, 'COMMA') + ' ₫/buổi'}"></strong><span th:text="| · ${item.sessionCount} buổi|"></span></p>
        <p class="job-live-muted" th:text="|${item.learnerName} · ${item.createdAtLabel} (UTC+7)|"></p>
        <a class="button button--outline" th:href="@{/job/detail(id=${item.id})}">Xem chi tiết</a>
      </article>
    </div><nav class="job-live-nav" th:if="${jobs != null}" aria-label="Phân trang">
      <a class="button button--outline" th:if="${jobs.hasPrevious()}" th:href="@{/job/my-job(page=${jobs.number - 1},q=${search.q},subjectId=${search.subjectId},gradeLevelId=${search.gradeLevelId},areaId=${search.areaId},deliveryModeId=${search.deliveryModeId},minPrice=${search.minPrice},maxPrice=${search.maxPrice},sort=${search.sort},size=${search.size},status=${selectedStatus})}">Trang trước</a>
      <span th:unless="${jobs.empty}" th:text="|Trang ${jobs.number + 1} / ${jobs.totalPages} · ${jobs.totalElements} tin|"></span>
      <a class="button button--outline" th:if="${jobs.hasNext()}" th:href="@{/job/my-job(page=${jobs.number + 1},q=${search.q},subjectId=${search.subjectId},gradeLevelId=${search.gradeLevelId},areaId=${search.areaId},deliveryModeId=${search.deliveryModeId},minPrice=${search.minPrice},maxPrice=${search.maxPrice},sort=${search.sort},size=${search.size},status=${selectedStatus})}">Trang sau</a>
    </nav></div></main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
</div></body></html>
