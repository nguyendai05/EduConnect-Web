<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;requests&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Tin tìm gia sư | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}">
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}">
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}">
<link rel="stylesheet" href="/css/components/navigation/filter-panel.css" th:href="@{/css/components/navigation/filter-panel.css}">
<link rel="stylesheet" href="/css/components/navigation/filter-chip.css" th:href="@{/css/components/navigation/filter-chip.css}">
<link rel="stylesheet" href="/css/components/navigation/pagination.css" th:href="@{/css/components/navigation/pagination.css}">
<link rel="stylesheet" href="/css/components/form/search-input.css" th:href="@{/css/components/form/search-input.css}">
<link rel="stylesheet" href="/css/components/form/select.css" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" href="/css/components/form/radio.css" th:href="@{/css/components/form/radio.css}">
<link rel="stylesheet" href="/css/components/domain/job/job-card.css" th:href="@{/css/components/domain/job/job-card.css}">
<link rel="stylesheet" href="/css/components/data-display/avatar.css" th:href="@{/css/components/data-display/avatar.css}">
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}">
<link rel="stylesheet" href="/css/components/feedback/empty-state.css" th:href="@{/css/components/feedback/empty-state.css}">
<link rel="stylesheet" href="/css/components/feedback/toast.css" th:href="@{/css/components/feedback/toast.css}">
<link rel="stylesheet" href="/css/pages/job/discover.css" th:href="@{/css/pages/job/discover.css}">
<link rel="stylesheet" href="/css/components/layout/brand-masthead.css" th:href="@{/css/components/layout/brand-masthead.css}">
<link rel="stylesheet" th:href="@{/css/components/data-display/card.css}">
<link rel="stylesheet" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" th:href="@{/css/pages/job/live.css}">
<link rel="stylesheet" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" th:href="@{/css/components/form/form-field.css}">
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
<script src="/js/pages/job/discover.js" defer th:src="@{/js/pages/job/discover.js}"></script>
</th:block>
<th:block th:fragment="scripts">

</th:block>
</head>
<body th:fragment="content"><div class="user-shell">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v9')}"></th:block>
<main class="user-shell__main"><div class="user-shell__content job-live"><th:block th:replace="~{pages/job/fragments :: navigation}"></th:block><th:block th:replace="~{pages/job/fragments :: messages}"></th:block><h1>Tin tìm gia sư</h1>
<form class="card job-live-panel" method="get" th:action="@{/job/discover}" th:if="${options != null and search != null}">
  <label class="form-field">Từ khóa<span class="input-control"><input class="input-control__input" name="q" th:value="${search.q}" maxlength="200" placeholder="Tìm theo tiêu đề hoặc nhu cầu học"></span></label>
  <div class="job-live-grid"><label class="form-field">Môn học<select class="select-control select-control--native" name="subjectId" >
      <option value="">Tất cả</option><option th:each="o : ${options.subjects}" th:value="${o.id}" th:text="${o.label}" th:selected="${o.id == search.subjectId}"></option>
    </select></label>
<label class="form-field">Cấp học<select class="select-control select-control--native" name="gradeLevelId" >
      <option value="">Tất cả</option><option th:each="o : ${options.grades}" th:value="${o.id}" th:text="${o.label}" th:selected="${o.id == search.gradeLevelId}"></option>
    </select></label>
<label class="form-field">Khu vực<select class="select-control select-control--native" name="areaId" >
      <option value="">Tất cả</option><option th:each="o : ${options.areas}" th:value="${o.id}" th:text="${o.label}" th:selected="${o.id == search.areaId}"></option>
    </select></label>
<label class="form-field">Hình thức<select class="select-control select-control--native" name="deliveryModeId" >
      <option value="">Tất cả</option><option th:each="o : ${options.modes}" th:value="${o.id}" th:text="${o.label}" th:selected="${o.id == search.deliveryModeId}"></option>
    </select></label></div>
  <div class="job-live-grid">
    <label class="form-field">Ngân sách từ (VND)<span class="input-control"><input class="input-control__input" name="minPrice" type="number" min="0" th:value="${search.minPrice}"></span></label>
    <label class="form-field">Ngân sách đến (VND)<span class="input-control"><input class="input-control__input" name="maxPrice" type="number" min="0" th:value="${search.maxPrice}"></span></label>
    <label class="form-field">Sắp xếp<select class="select-control select-control--native" name="sort"><option value="newest" th:selected="${search.sort == 'newest'}">Ngày tạo giảm dần</option><option value="budget-asc" th:selected="${search.sort == 'budget-asc'}">Ngân sách tăng dần</option><option value="budget-desc" th:selected="${search.sort == 'budget-desc'}">Ngân sách giảm dần</option></select></label>
  </div>
  <div class="job-live-actions"><button class="button button--primary" type="submit">Tìm tin</button><a class="button button--outline" th:href="@{/job/discover}">Xóa bộ lọc</a></div>
</form><p class="card job-live-panel" th:if="${jobs != null and jobs.empty}">Chưa có tin phù hợp.</p>
    <div class="job-live-list" th:if="${jobs != null}">
      <article class="card job-live-panel" th:each="item : ${jobs.content}">
        <div class="job-live-heading"><span class="badge badge--info" th:text="${item.statusLabel}"></span><small th:text="${item.publicCode}"></small></div>
        <h2><a th:href="@{/job/detail(id=${item.id})}" th:text="${item.title}"></a></h2>
        <p th:text="|${item.subject} · ${item.grade} · ${item.area} · ${item.deliveryMode}|"></p>
        <p><strong th:text="${#numbers.formatDecimal(item.budgetPerSession, 0, 'POINT', 0, 'COMMA') + ' ₫/buổi'}"></strong><span th:text="| · ${item.sessionCount} buổi|"></span></p>
        <p class="job-live-muted" th:text="|${item.learnerName} · ${item.createdAtLabel} (UTC+7)|"></p>
        <a class="button button--outline" th:href="@{/job/detail(id=${item.id})}">Xem chi tiết</a>
      </article>
    </div><nav class="job-live-nav" th:if="${jobs != null}" aria-label="Phân trang">
      <a class="button button--outline" th:if="${jobs.hasPrevious()}" th:href="@{/job/discover(page=${jobs.number - 1},q=${search.q},subjectId=${search.subjectId},gradeLevelId=${search.gradeLevelId},areaId=${search.areaId},deliveryModeId=${search.deliveryModeId},minPrice=${search.minPrice},maxPrice=${search.maxPrice},sort=${search.sort},size=${search.size})}">Trang trước</a>
      <span th:unless="${jobs.empty}" th:text="|Trang ${jobs.number + 1} / ${jobs.totalPages} · ${jobs.totalElements} tin|"></span>
      <a class="button button--outline" th:if="${jobs.hasNext()}" th:href="@{/job/discover(page=${jobs.number + 1},q=${search.q},subjectId=${search.subjectId},gradeLevelId=${search.gradeLevelId},areaId=${search.areaId},deliveryModeId=${search.deliveryModeId},minPrice=${search.minPrice},maxPrice=${search.maxPrice},sort=${search.sort},size=${search.size})}">Trang sau</a>
    </nav></div></main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
</div></body></html>
