<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;requests&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Ứng viên gia sư | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}">
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}">
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}">
<link rel="stylesheet" href="/css/components/navigation/breadcrumb.css" th:href="@{/css/components/navigation/breadcrumb.css}">
<link rel="stylesheet" href="/css/components/navigation/filter-chip.css" th:href="@{/css/components/navigation/filter-chip.css}">
<link rel="stylesheet" href="/css/components/form/search-input.css" th:href="@{/css/components/form/search-input.css}">
<link rel="stylesheet" href="/css/components/form/select.css" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" href="/css/components/form/checkbox.css" th:href="@{/css/components/form/checkbox.css}">
<link rel="stylesheet" href="/css/components/domain/job/applicant-card.css" th:href="@{/css/components/domain/job/applicant-card.css}">
<link rel="stylesheet" href="/css/components/data-display/table.css" th:href="@{/css/components/data-display/table.css}">
<link rel="stylesheet" href="/css/components/data-display/tag.css" th:href="@{/css/components/data-display/tag.css}">
<link rel="stylesheet" href="/css/components/feedback/empty-state.css" th:href="@{/css/components/feedback/empty-state.css}">
<link rel="stylesheet" href="/css/components/feedback/modal.css" th:href="@{/css/components/feedback/modal.css}">
<link rel="stylesheet" href="/css/components/feedback/toast.css" th:href="@{/css/components/feedback/toast.css}">
<link rel="stylesheet" href="/css/pages/job/applicants.css" th:href="@{/css/pages/job/applicants.css}">
<link rel="stylesheet" th:href="@{/css/components/data-display/card.css}">
<link rel="stylesheet" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" th:href="@{/css/pages/job/live.css}">
<link rel="stylesheet" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" th:href="@{/css/components/form/form-field.css}">
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
<script src="/js/pages/job/applicants.js" defer th:src="@{/js/pages/job/applicants.js}"></script>
</th:block>
<th:block th:fragment="scripts">

</th:block>
</head>
<body th:fragment="content"><div class="user-shell">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v9')}"></th:block>
<main class="user-shell__main"><div class="user-shell__content job-live"><th:block th:replace="~{pages/job/fragments :: navigation('mine')}"></th:block><th:block th:replace="~{pages/job/fragments :: messages}"></th:block><th:block th:if="${job != null and applications != null}">
  <h1 th:text="|Ứng viên: ${job.title}|"></h1><a th:href="@{/job/detail(id=${job.id})}">Xem nội dung tin và thỏa thuận đã chọn</a>
  <p class="alert">Chọn một gia sư đồng nghĩa đồng ý toàn bộ nội dung tin và đề xuất ứng tuyển hiển thị bên dưới. Khi chọn xong, tin ngừng nhận ứng tuyển; chưa phát sinh đơn hoặc thanh toán.</p>
  <p class="card job-live-panel" th:if="${applications.empty}">Chưa có ứng viên.</p>
  <div class="job-live-list"><article class="card job-live-panel" th:each="app : ${applications.content}">
    <div class="job-live-heading"><h2 th:text="${app.tutorName}"></h2><span class="badge badge--info" th:text="${app.statusLabel}"></span></div><p th:text="${app.headline}"></p>
    <strong th:text="${#numbers.formatDecimal(app.proposedUnitPrice, 0, 'POINT', 0, 'COMMA') + ' ₫/buổi'}"></strong><p class="job-live-copy" th:text="${app.message}"></p>
    <div class="job-live-actions">
      <a class="button button--outline" th:href="@{/chat/with(tutor=${app.tutorId})}">Nhắn tin với gia sư</a>
      <a class="button button--primary" th:if="${app.status.name() == 'SELECTED'}" th:href="@{/contract/confirm(applicationId=${app.id})}">Xác nhận hợp đồng</a>
    </div>
    <form method="post" class="job-live-stack" th:if="${app.canSelect}" th:action="@{/job/{id}/applications/{appId}/action(id=${job.id},appId=${app.id})}" data-job-live-form>
      <input type="hidden" name="jobVersion" th:value="${job.version}"><input type="hidden" name="applicationVersion" th:value="${app.version}">
      <label class="job-live-consent"><input type="checkbox" name="consent" value="true" required><span>Tôi đồng ý chọn gia sư với giá và toàn bộ đề xuất này, cùng nội dung tin của tôi.</span></label>
      <button class="button button--primary" name="action" value="select" type="submit">Đồng ý và chọn gia sư</button>
    </form>
    <form method="post" th:if="${app.canReject}" th:action="@{/job/{id}/applications/{appId}/action(id=${job.id},appId=${app.id})}" data-job-live-form><input type="hidden" name="jobVersion" th:value="${job.version}"><input type="hidden" name="applicationVersion" th:value="${app.version}"><button class="button button--outline" name="action" value="reject" type="submit">Từ chối ứng viên</button></form>
  </article></div>
  <nav class="job-live-nav" aria-label="Phân trang ứng viên"><a class="button button--outline" th:if="${applications.hasPrevious()}" th:href="@{/job/applicants(id=${job.id},page=${applications.number - 1})}">Trang trước</a><span th:unless="${applications.empty}" th:text="|Trang ${applications.number + 1} / ${applications.totalPages}|"></span><a class="button button--outline" th:if="${applications.hasNext()}" th:href="@{/job/applicants(id=${job.id},page=${applications.number + 1})}">Trang sau</a></nav>
</th:block></div></main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
</div></body></html>
