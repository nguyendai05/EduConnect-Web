<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;requests&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Đăng tin tìm gia sư | Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/layouts.css" th:href="@{/css/layouts.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}">
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}">
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}">
<link rel="stylesheet" href="/css/components/navigation/breadcrumb.css" th:href="@{/css/components/navigation/breadcrumb.css}">
<link rel="stylesheet" href="/css/components/form/form-field.css" th:href="@{/css/components/form/form-field.css}">
<link rel="stylesheet" href="/css/components/form/input.css" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" href="/css/components/form/select.css" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" href="/css/components/form/radio.css" th:href="@{/css/components/form/radio.css}">
<link rel="stylesheet" href="/css/components/form/textarea.css" th:href="@{/css/components/form/textarea.css}">
<link rel="stylesheet" href="/css/components/domain/job/job-card.css" th:href="@{/css/components/domain/job/job-card.css}">
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/components/feedback/modal.css" th:href="@{/css/components/feedback/modal.css}">
<link rel="stylesheet" href="/css/components/feedback/toast.css" th:href="@{/css/components/feedback/toast.css}">
<link rel="stylesheet" href="/css/pages/job/create.css" th:href="@{/css/pages/job/create.css}">
<link rel="stylesheet" th:href="@{/css/components/data-display/card.css}">
<link rel="stylesheet" th:href="@{/css/pages/job/live.css}">
<link rel="stylesheet" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" th:href="@{/css/components/form/select.css}">
<link rel="stylesheet" th:href="@{/css/components/form/form-field.css}">
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
<script src="/js/pages/job/create.js" defer th:src="@{/js/pages/job/create.js}"></script>
</th:block>
<th:block th:fragment="scripts">

</th:block>
</head>
<body th:fragment="content"><div class="user-shell">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v9')}"></th:block>
<main class="user-shell__main"><div class="user-shell__content job-live"><th:block th:replace="~{pages/job/fragments :: navigation('create')}"></th:block><th:block th:replace="~{pages/job/fragments :: messages}"></th:block><h1 th:text="${editingId == null ? 'Đăng tin tìm gia sư' : 'Sửa tin tìm gia sư'}"></h1>
<p class="alert">Tin chỉ được công khai sau khi admin duyệt. Ghi đủ nhu cầu và điều kiện để gia sư đề xuất đúng.</p>
<form th:if="${jobRequest != null and options != null}" class="card job-live-panel" method="post" th:action="@{/job/create(id=${editingId})}" th:object="${jobRequest}" data-job-live-form>
  <input type="hidden" th:field="*{requestKey}"><input type="hidden" th:field="*{version}">
  <section class="alert alert--error" th:if="${#fields.hasErrors('*')}" role="alert"><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></section>
  <label class="form-field">Tiêu đề<span class="input-control"><input class="input-control__input" th:field="*{title}" maxlength="220" required></span></label>
  <div class="job-live-grid"><label class="form-field">Môn học<span class="input-control"><input class="input-control__input" th:field="*{subjectName}" list="job-subject-list" required maxlength="60" placeholder="Chọn gợi ý hoặc tự nhập môn" autocomplete="off"></span><datalist id="job-subject-list"><option th:each="o : ${options.subjects}" th:value="${o.label}"></option></datalist></label>
<label class="form-field">Cấp học<span class="input-control"><input class="input-control__input" th:field="*{gradeLevelName}" list="job-grade-list" required maxlength="60" placeholder="Chọn gợi ý hoặc tự nhập cấp học" autocomplete="off"></span><datalist id="job-grade-list"><option th:each="o : ${options.grades}" th:value="${o.label}"></option></datalist></label>
<label class="form-field">Khu vực<select class="select-control select-control--native" th:field="*{areaId}" required>
      <option value="">Chọn</option><option th:each="o : ${options.areas}" th:value="${o.id}" th:text="${o.label}" ></option>
    </select></label>
<label class="form-field">Hình thức<select class="select-control select-control--native" th:field="*{deliveryModeId}" required>
      <option value="">Chọn</option><option th:each="o : ${options.modes}" th:value="${o.id}" th:text="${o.label}" ></option>
    </select></label></div>
  <div class="job-live-grid">
    <label class="form-field">Ngân sách mỗi buổi (VND)<span class="input-control"><input class="input-control__input" type="number" th:field="*{budgetPerSession}" min="1" step="1" required></span></label>
    <label class="form-field">Số buổi<span class="input-control"><input class="input-control__input" type="number" th:field="*{sessionCount}" min="1" max="32767" step="1" required></span></label>
  </div>
  <label class="form-field">Nhu cầu, lịch học và điều kiện<textarea class="textarea-control" th:field="*{description}" rows="10" maxlength="8000" required></textarea></label>
  <p class="job-live-muted">Ghi mục tiêu, thời lượng mỗi buổi, ngày/giờ và múi giờ, địa điểm, các yêu cầu cần gia sư đồng ý. Sau khi công khai, nội dung không sửa để giữ đúng đề xuất đã ứng tuyển.</p>
  <div class="job-live-actions"><button class="button button--outline" name="action" value="draft" type="submit">Lưu bản nháp</button><button class="button button--primary" name="action" value="submit" type="submit">Gửi admin duyệt</button></div>
</form></div></main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
</div></body></html>
