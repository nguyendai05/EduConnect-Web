<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/user :: page(~{::title}, &#x27;none&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Kết quả thanh toán — Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/components/layout/user-header.css" th:href="@{/css/components/layout/user-header.css}"/>
<link rel="stylesheet" href="/css/components/layout/user-footer.css" th:href="@{/css/components/layout/user-footer.css}"/>
<link rel="stylesheet" href="/css/components/layout/page-header.css" th:href="@{/css/components/layout/page-header.css}"/>
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}"/>
<link rel="stylesheet" href="/css/components/feedback/badge.css" th:href="@{/css/components/feedback/badge.css}"/>
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}"/>
<link rel="stylesheet" href="/css/components/data-display/card.css" th:href="@{/css/components/data-display/card.css}"/>
<link rel="stylesheet" href="/css/components/data-display/info-row.css" th:href="@{/css/components/data-display/info-row.css}"/>
<link rel="stylesheet" href="/css/pages/contract/confirm.css" th:href="@{/css/pages/contract/confirm.css}"/>
<link rel="stylesheet" href="/css/pages/payment/result.css" th:href="@{/css/pages/payment/result.css}"/>
</th:block>
<th:block th:fragment="headScripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/user-header.js" defer th:src="@{/js/core/user-header.js}"></script>
</th:block>
<th:block th:fragment="scripts">
<script src="/js/pages/payment/result.js" defer th:src="@{/js/pages/payment/result.js}"></script>
</th:block>
</head>
<body th:fragment="content">
<th:block th:replace="~{fragments/header-user :: header(${active}, 'v1')}"></th:block>
<main class="confirm-page">
    <header class="page-header"><div class="page-header__title-block">
        <h1 class="page-header__title">Kết quả thanh toán</h1>
    </div></header>
    <section class="card" th:if="${payment == null}"><div class="card__body confirm-stack">
        <h2 class="card__title">Chưa chọn hợp đồng</h2>
        <p class="confirm-muted">Mở thanh toán từ lịch sử đơn đăng ký.</p>
        <a class="button button--primary" th:href="@{/order/history}">Về lịch sử đơn</a>
    </div></section>
    <section class="card" th:if="${payment != null}"><div class="card__body confirm-stack">
        <span class="badge" th:classappend="${payment.paid} ? 'badge--success' : 'badge--warning'" th:text="${payment.statusLabel}"></span>
                <dl class="info-row"><dt class="info-row__label">Hợp đồng</dt><dd class="info-row__value" th:text="${payment.contractCode + ' · ' + payment.title}"></dd></dl>
                <dl class="info-row"><dt class="info-row__label">Tổng tiền</dt><dd class="info-row__value" th:text="${#numbers.formatDecimal(payment.total, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></dd></dl>
                <dl class="info-row"><dt class="info-row__label">Trả từ ví</dt><dd class="info-row__value" th:text="${#numbers.formatDecimal(payment.walletAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></dd></dl>
                <dl class="info-row"><dt class="info-row__label">Còn thiếu (thanh toán qua PayOS)</dt><dd class="info-row__value" th:text="${#numbers.formatDecimal(payment.providerAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></dd></dl>
        <p class="confirm-muted" th:if="${payment.paid}">Thanh toán thành công. Hợp đồng đã được kích hoạt.</p>
        <a class="button button--primary" th:if="${payment.paid}" th:href="@{/contract/student-detail(contract=${payment.contractId})}">Xem hợp đồng</a>
        <a class="button button--primary" th:if="${!payment.paid and payment.canPay}" th:href="@{/payment/checkout(contract=${payment.contractId})}">Thử thanh toán lại</a>
        <a class="button button--outline" th:href="@{/order/history}">Về lịch sử đơn</a>
    </div></section>
</main>
<th:block th:replace="~{fragments/footer-user :: footer(${active}, 'v1')}"></th:block>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
