<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth :: page(~{::title}, &#x27;none&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Đăng nhập · Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/utilities.css" th:href="@{/css/utilities.css}">
<link rel="stylesheet" href="/css/components/form/input.css" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" href="/css/components/form/password-input.css" th:href="@{/css/components/form/password-input.css}">
<link rel="stylesheet" href="/css/components/form/checkbox.css" th:href="@{/css/components/form/checkbox.css}">
<link rel="stylesheet" href="/css/components/action/button.css" th:href="@{/css/components/action/button.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/pages/auth/login.css" th:href="@{/css/pages/auth/login.css}">
</th:block>
<th:block th:fragment="headScripts">

</th:block>
<th:block th:fragment="scripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/password-input.js" defer th:src="@{/js/core/password-input.js}"></script>
<script src="/js/pages/auth/login.js" defer th:src="@{/js/pages/auth/login.js}"></script>
</th:block>
</head>
<body class="auth-login-page" data-login-state="" th:fragment="content">
    <th:block th:replace="~{fragments/header-auth :: header(${active}, 'v1')}"></th:block>

    <main class="auth-login-main">

        <section class="auth-login-card" aria-labelledby="login-title">
            <header class="auth-login-card__heading">
                <h1 id="login-title">Đăng nhập</h1>

            </header>



            <section class="alert alert--success" role="status" th:if="${param.verified != null or param.logout != null}">
                <div class="alert__content"><p class="alert__message" th:text="${param.verified != null ? 'Xác minh email thành công. Bạn có thể đăng nhập.' : 'Bạn đã đăng xuất.'}"></p></div>
            </section>

            <section class="alert alert--error auth-login-status" role="alert" th:if="${param.error != null or param.expired != null or !authenticationEnabled}">
                <div class="alert__content"><p class="alert__message" th:text="${!authenticationEnabled ? 'Chạy ứng dụng với profile db-dev để đăng nhập bằng MySQL.' : (param.expired != null ? 'Phiên đăng nhập đã hết hiệu lực. Vui lòng đăng nhập lại.' : 'Email hoặc mật khẩu không đúng, email chưa xác minh hoặc tài khoản đã bị khóa/vô hiệu hóa.')}"></p></div>
            </section>

            <form class="auth-login-form" method="post" th:action="@{/auth/login}" data-login-form>
                <div class="auth-login-form__field">
                    <label for="login-email">Email</label>
                    <div class="input-control" data-email-control>
                        <img class="input-control__icon" src="/assets/icons/email.svg" alt="" th:src="@{/assets/icons/email.svg}">
                        <input class="input-control__input input-control__input--with-leading" id="login-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" maxlength="254" aria-describedby="login-email-error" required>
                    </div>
                    <p class="auth-login-form__error" id="login-email-error" hidden></p>
                </div>

                <div class="auth-login-form__field" data-component="password-input">
                    <div class="auth-login-form__field-label"><label for="login-password">Mật khẩu</label><a th:if="${!authenticationEnabled}" href="/auth/forgot-password" th:href="@{/auth/forgot-password}">Quên mật khẩu?</a></div>
                    <div class="password-control" data-password-control>
                        <img class="auth-login-form__leading-icon" src="/assets/icons/lock.svg" alt="" th:src="@{/assets/icons/lock.svg}">
                        <input class="password-control__input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" maxlength="72" aria-describedby="login-password-error" required>
                        <button class="password-control__toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="login-password" aria-pressed="false" data-password-toggle>
                            <img src="/assets/icons/mat.svg" data-icon-show="../../assets/icons/mat.svg" data-icon-hide="../../assets/icons/mat-tat.svg" alt="" th:src="@{/assets/icons/mat.svg}" th:attr="data-icon-show=@{/assets/icons/mat.svg}, data-icon-hide=@{/assets/icons/mat-tat.svg}">
                        </button>
                    </div>
                    <p class="auth-login-form__error" id="login-password-error" hidden></p>
                </div>


                <!-- Tạm thời: Button component chưa có implementation, nên dùng nút cấp trang. Thay bằng Button chuẩn khi hỗ trợ loading state. -->
                <button class="auth-login-form__submit" type="submit" th:disabled="${!authenticationEnabled}" data-login-submit><span data-login-submit-label>Đăng nhập</span><span class="auth-login-form__spinner" aria-hidden="true" hidden></span></button>
            </form>

            <p class="auth-login-card__register">Chưa có tài khoản? <a href="/auth/register" th:href="@{/auth/register}">Đăng ký ngay</a></p>


        </section>
    </main>

    <th:block th:replace="~{fragments/footer-auth :: footer(${active}, 'v1')}"></th:block>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
