<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth :: page(~{::title}, 'none', ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
    <title>Đặt lại mật khẩu · Edu Connect</title>
    <th:block th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/utilities.css}">
        <link rel="stylesheet" th:href="@{/css/components/action/button.css}">
        <link rel="stylesheet" th:href="@{/css/components/form/password-input.css}">
        <link rel="stylesheet" th:href="@{/css/components/feedback/alert.css}">
        <link rel="stylesheet" th:href="@{/css/pages/auth/login.css}">
        <link rel="stylesheet" th:href="@{/css/pages/auth/reset-password.css}">
    </th:block>
    <th:block th:fragment="headScripts"></th:block>
    <th:block th:fragment="scripts"><script defer th:src="@{/js/core/password-input.js}"></script></th:block>
</head>
<body class="auth-login-page auth-reset-page" th:fragment="content">
    <th:block th:replace="~{fragments/header-auth :: header(${active}, 'v1')}"></th:block>
    <main class="auth-login-main">
        <section class="auth-login-card auth-reset-card" aria-labelledby="reset-title">
            <header class="auth-login-card__heading">
                <h1 id="reset-title">Đặt lại mật khẩu</h1>
                <p>Mỗi liên kết chỉ dùng một lần. Sau khi đổi mật khẩu, bạn cần đăng nhập lại.</p>
            </header>
            <form class="auth-login-form" th:if="${authenticationEnabled and resetState.name() == 'VALID'}" method="post" th:action="@{/auth/reset-password}" th:object="${resetPasswordForm}">
                <input type="hidden" th:field="*{token}">
                <div class="alert alert--error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
                <div class="auth-login-form__field" data-component="password-input">
                    <label for="reset-password">Mật khẩu mới</label>
                    <div class="password-control">
                        <input class="password-control__input" id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="reset-password-hint">
                        <button class="password-control__toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="reset-password" aria-pressed="false" data-password-toggle><img th:src="@{/assets/icons/mat.svg}" th:attr="data-icon-show=@{/assets/icons/mat.svg}, data-icon-hide=@{/assets/icons/mat-tat.svg}" alt=""></button>
                    </div>
                    <p class="auth-reset-hint" id="reset-password-hint">Mật khẩu từ 8 đến 72 ký tự.</p>
                </div>
                <div class="auth-login-form__field" data-component="password-input">
                    <label for="reset-confirm-password">Xác nhận mật khẩu mới</label>
                    <div class="password-control">
                        <input class="password-control__input" id="reset-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" maxlength="72" required>
                        <button class="password-control__toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="reset-confirm-password" aria-pressed="false" data-password-toggle><img th:src="@{/assets/icons/mat.svg}" th:attr="data-icon-show=@{/assets/icons/mat.svg}, data-icon-hide=@{/assets/icons/mat-tat.svg}" alt=""></button>
                    </div>
                </div>
                <button class="button button--primary" type="submit">Đặt lại mật khẩu</button>
            </form>
            <section class="auth-reset-panel" th:if="${resetState.name() != 'VALID'}" th:switch="${resetState.name()}">
                <h2 class="auth-reset-panel__title" th:case="'EXPIRED'">Liên kết đã hết hạn</h2>
                <h2 class="auth-reset-panel__title" th:case="'USED'">Liên kết đã được sử dụng</h2>
                <h2 class="auth-reset-panel__title" th:case="'MISSING'">Mở liên kết trong email để đặt lại mật khẩu</h2>
                <h2 class="auth-reset-panel__title" th:case="*">Liên kết không hợp lệ hoặc đã bị thay thế</h2>
            </section>
            <nav class="auth-reset-actions" aria-label="Liên kết liên quan">
                <a class="button button--outline" th:href="@{/auth/forgot-password}">Yêu cầu liên kết mới</a>
                <a th:href="@{/auth/login}">Về trang đăng nhập</a>
            </nav>
        </section>
    </main>
    <th:block th:replace="~{fragments/footer-auth :: footer(${active}, 'v1')}"></th:block>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
