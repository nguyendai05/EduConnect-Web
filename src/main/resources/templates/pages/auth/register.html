<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth :: page(~{::title}, &#x27;none&#x27;, ~{::styles}, ~{::content}, ~{::scripts}, ~{::headScripts}, false)}">
<head>
<title>Đăng ký · Edu Connect</title>
<th:block th:fragment="styles">
<link rel="stylesheet" href="/css/utilities.css" th:href="@{/css/utilities.css}">
<link rel="stylesheet" href="/css/components/form/input.css" th:href="@{/css/components/form/input.css}">
<link rel="stylesheet" href="/css/components/form/password-input.css" th:href="@{/css/components/form/password-input.css}">
<link rel="stylesheet" href="/css/components/feedback/alert.css" th:href="@{/css/components/feedback/alert.css}">
<link rel="stylesheet" href="/css/pages/auth/register.css" th:href="@{/css/pages/auth/register.css}">
</th:block>
<th:block th:fragment="headScripts">

</th:block>
<th:block th:fragment="scripts">
<script src="/js/core/route.js" defer th:src="@{/js/core/route.js}"></script>
<script src="/js/core/password-input.js" defer th:src="@{/js/core/password-input.js}"></script>
<script src="/js/pages/auth/register.js" defer th:src="@{/js/pages/auth/register.js}"></script>
</th:block>
</head>
<body class="auth-register-page" th:fragment="content">
    <th:block th:replace="~{fragments/header-auth :: header(${active}, 'v2')}"></th:block>

    <main class="auth-register-main">

        <section class="auth-register-card" aria-labelledby="register-title">
            <header class="auth-register-card__heading"><h1 id="register-title">Đăng ký tài khoản</h1></header>
            <section class="alert alert--info" th:if="${!authenticationEnabled}"><div class="alert__content"><p class="alert__message">Chạy ứng dụng với profile db-dev để tạo tài khoản trong MySQL.</p></div></section>


            <form class="auth-register-form" method="post" th:action="@{/auth/register}" th:object="${registrationForm}" data-register-form>
                <section class="alert alert--error" role="alert" th:if="${#fields.hasAnyErrors()}"><div class="alert__content"><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div></section>
                <!-- Tạm thời: RoleSelector chưa có component dùng chung; dùng radio card cấp trang. -->
                <fieldset class="auth-register-role"><legend>Bạn muốn sử dụng Edu Connect để làm gì?</legend>
                    <label class="auth-register-role__option"><input type="radio" name="role" value="learner" th:field="*{role}"><span><strong>Học / tìm gia sư</strong><small>Dành cho học viên hoặc phụ huynh.</small></span></label>
                    <label class="auth-register-role__option"><input type="radio" name="role" value="tutor" th:field="*{role}"><span><strong>Gia sư / Giảng viên</strong><small>Nhận lớp và quản lý lịch dạy.</small></span></label>
                </fieldset>

                <div class="auth-register-form__field"><label for="register-name">Họ và tên</label><div class="input-control" data-register-control="name"><input class="input-control__input" id="register-name" name="name" th:field="*{name}" maxlength="120" type="text" autocomplete="name" placeholder="Nhập họ và tên" aria-describedby="register-name-error" required></div><p class="auth-register-form__error" id="register-name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div>
                <div class="auth-register-form__field"><label for="register-email">Email</label><div class="input-control" data-register-control="email"><img class="input-control__icon" src="/assets/icons/email.svg" alt="" th:src="@{/assets/icons/email.svg}"><input class="input-control__input input-control__input--with-leading" id="register-email" name="email" th:field="*{email}" maxlength="254" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" aria-describedby="register-email-error" required></div><p class="auth-register-form__error" id="register-email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p></div>
                <div class="auth-register-form__field"><label for="register-phone">Số điện thoại</label><div class="input-control" data-register-control="phone"><img class="input-control__icon" src="/assets/icons/phone.svg" alt="" th:src="@{/assets/icons/phone.svg}"><input class="input-control__input input-control__input--with-leading" id="register-phone" name="phone" th:field="*{phone}" maxlength="24" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ví dụ: 0912 345 678" aria-describedby="register-phone-error" required></div><p class="auth-register-form__error" id="register-phone-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p></div>

                <div class="auth-register-form__field" data-component="password-input"><label for="register-password">Mật khẩu</label><div class="password-control" data-register-control="password"><img class="auth-register-form__leading-icon" src="/assets/icons/lock.svg" alt="" th:src="@{/assets/icons/lock.svg}"><input class="password-control__input" id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự" minlength="8" maxlength="72" aria-describedby="register-password-error" required><button class="password-control__toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="register-password" aria-pressed="false" data-password-toggle><img src="/assets/icons/mat.svg" data-icon-show="../../assets/icons/mat.svg" data-icon-hide="../../assets/icons/mat-tat.svg" alt="" th:src="@{/assets/icons/mat.svg}" th:attr="data-icon-show=@{/assets/icons/mat.svg}, data-icon-hide=@{/assets/icons/mat-tat.svg}"></button></div><p class="auth-register-form__error" id="register-password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p></div>
                <div class="auth-register-form__field" data-component="password-input"><label for="register-confirm-password">Xác nhận mật khẩu</label><div class="password-control" data-register-control="confirm-password"><img class="auth-register-form__leading-icon" src="/assets/icons/lock.svg" alt="" th:src="@{/assets/icons/lock.svg}"><input class="password-control__input" id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" maxlength="72" aria-describedby="register-confirm-password-error" required><button class="password-control__toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="register-confirm-password" aria-pressed="false" data-password-toggle><img src="/assets/icons/mat.svg" data-icon-show="../../assets/icons/mat.svg" data-icon-hide="../../assets/icons/mat-tat.svg" alt="" th:src="@{/assets/icons/mat.svg}" th:attr="data-icon-show=@{/assets/icons/mat.svg}, data-icon-hide=@{/assets/icons/mat-tat.svg}"></button></div><p class="auth-register-form__error" id="register-confirm-password-error" hidden></p></div>

                <!-- Tạm thời: Button component chưa có implementation, nên dùng nút cấp trang. Thay bằng Button chuẩn khi hỗ trợ loading state. -->
                <button class="auth-register-form__submit" type="submit" th:disabled="${!authenticationEnabled}" data-register-submit><span data-register-submit-label>Nhận mã xác minh</span><span class="auth-register-form__spinner" aria-hidden="true" hidden></span></button>
            </form>
            <p class="auth-register-card__login">Đã có tài khoản? <a href="/auth/login" th:href="@{/auth/login}">Đăng nhập</a> <a th:if="${!authenticationEnabled}" href="/auth/forgot-password" th:href="@{/auth/forgot-password}">Quên mật khẩu?</a></p>

        </section>
    </main>

    <th:block th:replace="~{fragments/footer-auth :: footer(${active}, 'v2')}"></th:block>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
