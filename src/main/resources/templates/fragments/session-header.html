<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="user">
    <header class="user-header">
        <div class="user-header__inner">
            <a class="user-header__brand" th:href="@{/home}" aria-label="Edu Connect - Trang chủ">
                <img class="user-header__logo" th:src="@{/assets/brand/logo-horizontal.svg}" alt="Edu Connect" width="4562" height="1000">
            </a>
            <nav class="user-header__nav" aria-label="Điều hướng chính">
                <a class="user-header__nav-link" th:href="@{/home}">Trang chủ</a>
                <a class="user-header__nav-link" sec:authorize="!hasRole('TUTOR')" th:href="@{/tutor/search}">Tìm gia sư</a>
                <a class="user-header__nav-link" th:href="@{/job/discover}">Tin tìm gia sư</a>
                <a class="user-header__nav-link" sec:authorize="hasRole('LEARNER')" th:href="@{/catalog/detail}">Khóa học</a>
                <a class="user-header__nav-link" sec:authorize="hasRole('LEARNER')" th:href="@{/cart/index}">Giỏ đăng ký</a>
                <a class="user-header__nav-link" sec:authorize="hasRole('TUTOR')" th:href="@{/tutor/manage}">Lớp của tôi</a>
                <a class="user-header__nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Quản trị</a>
            </nav>
            <div class="user-header__actions" th:if="${currentUser != null}">
                <a class="user-header__icon-button" sec:authorize="hasAnyRole('LEARNER','TUTOR')" th:href="@{/chat/messages}" aria-label="Tin nhắn" title="Tin nhắn" data-chat-toggle>
                    <img th:src="@{/assets/icons/message.svg}" alt="">
                    <span class="user-header__badge" hidden data-chat-badge-header></span>
                </a>
                <span class="user-header__divider" aria-hidden="true"></span>
                <div class="user-header__account" data-account-menu th:attr="data-badges=@{/header/badges}">
                    <button class="user-header__profile" type="button" aria-label="Mở menu tài khoản" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
                        <span class="user-header__avatar" aria-hidden="true" data-avatar th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">A</span>
                        <span class="user-header__dot" hidden data-pending-dot></span>
                        <span class="user-header__profile-copy">
                            <strong th:text="${currentUser.displayName}">Tên</strong>
                            <span sec:authorize="hasRole('TUTOR')">Gia sư</span>
                            <span sec:authorize="!hasRole('TUTOR') and hasRole('LEARNER')">Học viên</span>
                            <span sec:authorize="hasRole('ADMIN')">Quản trị viên</span>
                        </span>
                        <img class="user-header__chevron" th:src="@{/assets/icons/mui-ten-xuong.svg}" alt="" data-chevron
                             th:attr="data-icon-closed=@{/assets/icons/mui-ten-xuong.svg},data-icon-open=@{/assets/icons/mui-ten-len.svg}">
                    </button>
                    <div class="user-header__menu" id="account-menu" role="menu" aria-label="Menu tài khoản" hidden>
                        <div class="user-header__menu-summary">
                            <div class="user-header__menu-summary-heading"><strong th:text="${currentUser.email}">email</strong></div>
                            <div class="user-header__menu-balance" sec:authorize="hasAnyRole('LEARNER','TUTOR')">
                                <span>Số dư ví:</span>
                                <strong data-menu-balance>—</strong>
                            </div>
                            <p class="user-header__pending" hidden data-pending-text></p>
                        </div>
                        <div class="user-header__menu-section">
                            <a class="user-header__menu-item" role="menuitem" th:href="@{/account/profile}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/profile.svg}" alt=""><span data-menu-label>Hồ sơ cá nhân</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasRole('TUTOR')" th:href="@{/tutor/my-profile}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/tutor-verification.svg}" alt=""><span data-menu-label>Hồ sơ giảng dạy</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasRole('LEARNER')" th:href="@{/job/my-job}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/library.svg}" alt=""><span data-menu-label>Tin của tôi</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasAnyRole('LEARNER','TUTOR')" th:href="@{/invitation/negotiation}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/email.svg}" alt=""><span data-menu-label>Lời mời</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasAnyRole('LEARNER','TUTOR')" th:href="@{/contract/my}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/certificate.svg}" alt=""><span data-menu-label>Hợp đồng</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasRole('LEARNER')" th:href="@{/order/history}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/activity-log.svg}" alt=""><span data-menu-label>Đơn đăng ký</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasRole('TUTOR')" th:href="@{/tutor/manage#tm-tab-orders}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/activity-log.svg}" alt=""><span data-menu-label>Đơn đăng ký</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasAnyRole('LEARNER','TUTOR')" th:href="@{/wallet/overview}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/wallet.svg}" alt=""><span data-menu-label>Ví Edu Connect</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                            <a class="user-header__menu-item" role="menuitem" sec:authorize="hasAnyRole('LEARNER','TUTOR')" th:href="@{/wallet/overview#transactions}">
                                <img class="user-header__menu-item-leading" th:src="@{/assets/icons/receipt.svg}" alt=""><span data-menu-label>Lịch sử giao dịch &amp; Hóa đơn</span>
                                <img class="user-header__menu-item-chevron" th:src="@{/assets/icons/chevron-right.svg}" alt="">
                            </a>
                        </div>
                        <div class="user-header__menu-section user-header__menu-section--logout">
                            <form method="post" th:action="@{/auth/logout}">
                                <button class="user-header__menu-item user-header__menu-item--danger" type="submit" role="menuitem">
                                    <img class="user-header__menu-item-icon" th:src="@{/assets/icons/dang-xuat.svg}" alt=""><span data-menu-logout-label>Đăng xuất</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="user-header__actions" th:if="${currentUser == null}">
                <a class="user-header__nav-link" th:href="@{/auth/login}">Đăng nhập</a>
                <a class="user-header__nav-link" th:href="@{/auth/register}">Đăng ký</a>
            </div>
        </div>
    </header>
    <link rel="stylesheet" th:href="@{/css/components/layout/session-header.css}">
    <script th:src="@{/js/core/session-header.js}" defer></script>
    <th:block sec:authorize="hasAnyRole('LEARNER','TUTOR')">
        <div class="chat-widget" data-chat-widget
             th:attr="data-list=@{/chat/widget/conversations},data-messages=@{/chat/widget/messages},data-open=@{/chat/widget/open},data-poll=@{/chat/poll}">
            <button class="chat-widget__fab" type="button" aria-label="Mở tin nhắn" data-chat-fab>
                <img th:src="@{/assets/icons/message.svg}" alt="" width="24" height="24">
                <span class="chat-widget__badge" hidden data-chat-badge></span>
            </button>
            <section class="chat-widget__panel" role="dialog" aria-label="Tin nhắn" hidden data-chat-panel>
                <header class="chat-widget__head" data-chat-handle>
                    <button class="chat-widget__icon" type="button" aria-label="Về danh sách" data-chat-back hidden>&#8249;</button>
                    <strong class="chat-widget__title" data-chat-title>Tin nhắn</strong>
                    <a class="chat-widget__full" th:href="@{/chat/messages}" data-chat-full>Xem tất cả</a>
                    <button class="chat-widget__icon" type="button" aria-label="Thu lại" data-chat-close>&times;</button>
                </header>
                <p class="chat-widget__error" role="alert" hidden data-chat-error></p>
                <div class="chat-widget__list" data-chat-list></div>
                <div class="chat-widget__thread" hidden data-chat-thread>
                    <div class="chat-widget__messages" data-chat-messages></div>
                    <form class="chat-widget__form" method="post" th:action="@{/chat/widget/send}" data-chat-form>
                        <input type="hidden" name="conversation">
                        <textarea name="body" rows="2" maxlength="1000" required placeholder="Nhập tin nhắn…" aria-label="Nội dung tin nhắn"></textarea>
                        <button class="chat-widget__send" type="submit">Gửi</button>
                    </form>
                </div>
            </section>
        </div>
    </th:block>
</th:block>
<th:block th:fragment="admin">
    <header class="admin-header">
        <nav class="admin-header__crumbs" aria-label="Đường dẫn trang" th:if="${adminCrumbs != null and !adminCrumbs.isEmpty()}">
            <ol>
                <li th:each="crumb, state : ${adminCrumbs}">
                    <a th:if="${crumb.url != null}" th:href="@{${crumb.url}}" th:text="${crumb.label}"></a>
                    <span th:if="${crumb.url == null}" aria-current="page" th:text="${crumb.label}"></span>
                </li>
            </ol>
        </nav>
        <div class="admin-header__utilities" th:if="${currentUser != null}">
            <span class="admin-header__profile-copy"><strong th:text="${currentUser.displayName}"></strong><small th:text="${currentUser.email}"></small></span>
            <form method="post" th:action="@{/auth/logout}"><button class="admin-header__profile-trigger" type="submit">Đăng xuất</button></form>
        </div>
    </header>
</th:block>
</html>
