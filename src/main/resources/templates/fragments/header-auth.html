<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><th:block th:fragment="header(active, variant)">
<header class="auth-login-header" th:if="${variant == &#x27;v1&#x27;}">
        <div class="container auth-login-header__content">
            <a class="auth-login-header__back" href="/home" th:href="@{/home}">← Về trang chủ</a>
            <a class="auth-login-header__brand" href="/home" aria-label="Edu Connect - Trang chủ" th:href="@{/home}"><img class="brand-logo" src="/assets/brand/logo-horizontal.svg" alt="Edu Connect" width="4562" height="1000" th:src="@{/assets/brand/logo-horizontal.svg}"></a>
            <span class="auth-login-header__spacer" aria-hidden="true"></span>
        </div>
    </header>
<header class="auth-register-header" th:if="${variant == &#x27;v2&#x27;}">
        <div class="container auth-register-header__content">
            <a class="auth-register-header__back" href="/home" th:href="@{/home}">← Về trang chủ</a>
            <a class="auth-register-header__brand" href="/home" aria-label="Edu Connect - Trang chủ" th:href="@{/home}"><img class="brand-logo" src="/assets/brand/logo-horizontal.svg" alt="Edu Connect" width="4562" height="1000" th:src="@{/assets/brand/logo-horizontal.svg}"></a>
            <span class="auth-register-header__spacer" aria-hidden="true"></span>
        </div>
    </header>
</th:block></html>
