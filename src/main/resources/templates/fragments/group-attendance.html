<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Điểm danh cả lớp nhóm (HUY-04). Cần model "groupClasses"; trang quản lý lớp chỉ cần nhúng một dòng:
     <th:block th:replace="~{fragments/group-attendance :: panel}"></th:block> -->
<th:block th:fragment="panel">
<link rel="stylesheet" th:href="@{/css/components/domain/lesson/group-attendance.css}">
<form class="tm-class-attend" method="post" th:action="@{/contract/session/attend-class}" th:each="g : ${groupClasses}">
            <input type="hidden" name="offering" th:value="${g.offeringId}">
            <div class="tm-class-attend__head">
              <strong th:text="${g.title}"></strong>
              <button class="button button--primary button--small" type="submit">Điểm danh cả lớp</button>
            </div>
            <ul class="tm-class-attend__list">
              <li th:each="l : ${g.learners}">
                <span th:text="${l.name + ' · buổi ' + l.nextSession}"></span>
                <label class="tm-class-attend__absent"><input type="checkbox" name="absent" th:value="${l.contractId}"> Vắng (vẫn tính phí)</label>
              </li>
            </ul>
          </form>
</th:block>
</body>
</html>
