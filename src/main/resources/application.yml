spring:
  application:
    name: educonnect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: db-dev
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      force: true

app:
  storage:
    # Minh chứng riêng tư (bằng cấp, chứng chỉ) ghi ngoài static; chỉ đọc qua /files/private/{id} sau khi kiểm quyền.
    private-dir: ${EDUCONNECT_PRIVATE_STORAGE_DIR:storage/private}
  ui-preview:
    enabled: true
