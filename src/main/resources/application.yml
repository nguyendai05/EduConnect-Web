spring:
  application:
    name: educonnect
  profiles:
    default: db-dev
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      force: true

app:
  ui-preview:
    enabled: true
