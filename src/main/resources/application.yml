spring:
  application:
    name: educonnect
  profiles:
    default: ui-preview
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  ui-preview:
    enabled: true
