# Profile DB development; secret phải cung cấp qua môi trường, không commit giá trị thật.
spring:
  mail:
    host: ${EDUCONNECT_MAIL_HOST:smtp.resend.com}
    port: ${EDUCONNECT_MAIL_PORT:465}
    username: ${EDUCONNECT_MAIL_USERNAME:resend}
    password: ${EDUCONNECT_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${EDUCONNECT_MAIL_AUTH:true}
      "[mail.smtp.ssl.enable]": ${EDUCONNECT_MAIL_SSL:true}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${EDUCONNECT_DB_URL:jdbc:mysql://127.0.0.1:3306/educonnect_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${EDUCONNECT_DB_USERNAME:root}
    password: ${EDUCONNECT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

app:
  password-reset:
    base-url: ${EDUCONNECT_PUBLIC_BASE_URL:http://localhost:8080}
    ttl: ${EDUCONNECT_RESET_TTL:30m}
    resend-cooldown: ${EDUCONNECT_RESET_COOLDOWN:60s}
    max-sends-per-hour: ${EDUCONNECT_RESET_MAX_SENDS:5}
  mail:
    from: ${EDUCONNECT_MAIL_FROM:}
  email-verification:
    ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
    max-sends-per-hour: 5
  payos:
    client-id: ${EDUCONNECT_PAYOS_CLIENT_ID:}
    api-key: ${EDUCONNECT_PAYOS_API_KEY:}
    checksum-key: ${EDUCONNECT_PAYOS_CHECKSUM_KEY:}
    public-base-url: ${EDUCONNECT_PUBLIC_BASE_URL:http://localhost:8080}
    link-ttl: ${EDUCONNECT_PAYOS_LINK_TTL:15m}
