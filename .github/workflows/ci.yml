name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Maven verify
        run: ./mvnw -B -ntp verify
      - name: Thymeleaf templates and routes
        run: |
          node scripts/checks/template-check.mjs
          node scripts/checks/route-check.mjs
      - name: Frozen prototype and database contracts
        run: |
          node scripts/checks/static-check.mjs
          node scripts/checks/hook-check.mjs
          node scripts/checks/source-check.mjs
          node scripts/checks/store-check.mjs
          node scripts/checks/database-static-check.mjs

  mysql-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: educonnect_test_shared
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      EDUCONNECT_JPA_TESTS: 'true'
      EDUCONNECT_MYSQL_TESTS: 'true'
      EDUCONNECT_JPA_TEST_URL: 'jdbc:mysql://127.0.0.1:3306/educonnect_test_shared?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
      EDUCONNECT_DB_URL: 'jdbc:mysql://127.0.0.1:3306/educonnect_test_shared?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
      EDUCONNECT_DB_USERNAME: root
      EDUCONNECT_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Flyway, Hibernate validation, JDBC auth and JPA contracts
        run: ./mvnw -B -ntp verify
