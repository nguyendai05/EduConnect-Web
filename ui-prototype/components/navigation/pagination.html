<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagination</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components/navigation/pagination.css">
</head>
<body style="padding: var(--space-6);">
<div class="pagination-bar">
    <span>Hiển thị <strong>1 - 10</strong> trong <strong>14</strong> bản ghi</span>

    <div class="pagination-controls">
        <button class="page-btn" disabled style="opacity: 0.5;"><i data-lucide="chevron-left" style="width:14px; height:14px;"></i></button>
        <button class="page-btn page-btn--active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn"><i data-lucide="chevron-right" style="width:14px; height:14px;"></i></button>
    </div>
</div>
</body>
</html>
