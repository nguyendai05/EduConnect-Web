<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs — Edu Connect</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components/navigation/tabs.css">
  <script src="../../js/core/tabs.js" defer></script>
</head>
<body class="tabs-component-page">
<main class="tabs-preview" aria-label="Các biến thể Tabs">
  <section class="tabs tabs--underline" data-tabs aria-label="Underline Tabs">
    <div class="tabs__list" role="tablist" aria-label="Danh mục hợp đồng">
      <button class="tabs__tab" type="button" role="tab" id="contract-overview-tab" aria-controls="contract-overview-panel" aria-selected="true" tabindex="0">Tổng quan<br>hợp đồng</button>
      <button class="tabs__tab" type="button" role="tab" id="lesson-roadmap-tab" aria-controls="lesson-roadmap-panel" aria-selected="false" tabindex="-1">Lộ trình<br>buổi học <span class="tabs__badge">8</span></button>
      <button class="tabs__tab" type="button" role="tab" id="escrow-log-tab" aria-controls="escrow-log-panel" aria-selected="false" tabindex="-1">Nhật ký ký quỹ<br>&amp; Giải ngân</button>
      <button class="tabs__tab" type="button" role="tab" id="review-tab" aria-controls="review-panel" aria-selected="false" aria-disabled="true" tabindex="-1">Đánh giá<br>(Chưa mở)</button>
    </div>
    <div class="tabs__panel" role="tabpanel" id="contract-overview-panel" aria-labelledby="contract-overview-tab"></div>
    <div class="tabs__panel" role="tabpanel" id="lesson-roadmap-panel" aria-labelledby="lesson-roadmap-tab" hidden></div>
    <div class="tabs__panel" role="tabpanel" id="escrow-log-panel" aria-labelledby="escrow-log-tab" hidden></div>
    <div class="tabs__panel" role="tabpanel" id="review-panel" aria-labelledby="review-tab" hidden></div>
  </section>

  <section class="tabs tabs--contained" data-tabs aria-label="Contained Tabs">
    <div class="tabs__list" role="tablist" aria-label="Trạng thái ký quỹ">
      <button class="tabs__tab" type="button" role="tab" id="escrow-all-tab" aria-controls="escrow-all-panel" aria-selected="true" tabindex="0">Tất cả (12)</button>
      <button class="tabs__tab" type="button" role="tab" id="escrow-holding-tab" aria-controls="escrow-holding-panel" aria-selected="false" tabindex="-1">Đang giữ (5)</button>
      <button class="tabs__tab" type="button" role="tab" id="escrow-released-tab" aria-controls="escrow-released-panel" aria-selected="false" tabindex="-1">Đã giải ngân (3)</button>
      <button class="tabs__tab" type="button" role="tab" id="escrow-refunded-tab" aria-controls="escrow-refunded-panel" aria-selected="false" tabindex="-1">Đã hoàn (0)</button>
    </div>
    <div class="tabs__panel" role="tabpanel" id="escrow-all-panel" aria-labelledby="escrow-all-tab"></div>
    <div class="tabs__panel" role="tabpanel" id="escrow-holding-panel" aria-labelledby="escrow-holding-tab" hidden></div>
    <div class="tabs__panel" role="tabpanel" id="escrow-released-panel" aria-labelledby="escrow-released-tab" hidden></div>
    <div class="tabs__panel" role="tabpanel" id="escrow-refunded-panel" aria-labelledby="escrow-refunded-tab" hidden></div>
  </section>
</main>
</body>
</html>
