<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User header</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components/layout/user-header.css">
</head>
<body>
<header class="user-header" data-component="user-header" data-user-variant="A-S">
    <div class="user-header__inner">
        <a class="user-header__brand" href="#trang-chu" aria-label="Edu Connect - Trang chủ">
            <span class="user-header__brand-mark" aria-hidden="true">
                <img src="../../assets/icons/logo.svg" alt="">
            </span>
            <span class="user-header__brand-name">Edu Connect</span>
        </a>

        <nav class="user-header__nav" aria-label="Điều hướng chính">
            <a class="user-header__nav-link is-active" data-nav-key="home" data-route="/app/dashboard" href="#trang-chu" aria-current="page">Trang chủ</a>
            <a class="user-header__nav-link" data-nav-key="tutors" data-route="/app/tutors" href="#tim-gia-su">Tìm gia sư</a>
            <a class="user-header__nav-link" data-nav-key="requests" data-route="/app/tutor-requests" href="#tin-tim-gia-su">Tin tìm gia sư</a>
            <a class="user-header__nav-link" data-nav-key="groups" data-route="/app/group-classes" href="#lop-nhom">Lớp nhóm</a>
        </nav>

        <div class="user-header__actions">
            <button class="user-header__icon-button" type="button" aria-label="Tin nhắn" title="Tin nhắn" data-user-action="messages">
                <img src="../../assets/icons/message.svg" alt="">
            </button>
            <button class="user-header__icon-button" type="button" aria-label="Thông báo" title="Thông báo" data-user-action="notifications">
                <img src="../../assets/icons/notification.svg" alt="">
            </button>

            <span class="user-header__divider" aria-hidden="true"></span>

            <div class="user-header__account">
                <button class="user-header__profile" type="button" aria-label="Mở menu tài khoản" aria-haspopup="menu" aria-expanded="false" aria-controls="user-account-menu">
                    <span class="user-header__avatar" aria-hidden="true" data-profile-initials>LY</span>
                    <span class="user-header__profile-copy">
                        <strong><span data-profile-name>Lê Hoàng Yến</span><img class="user-header__verified" data-profile-verified src="../../assets/icons/verified.svg" alt="Đã xác thực" hidden></strong>
                        <span data-profile-role>Gia sư Chuyên Toán</span>
                    </span>
                    <img class="user-header__chevron" src="../../assets/icons/mui-ten-xuong.svg" data-icon-closed="../../assets/icons/mui-ten-xuong.svg" data-icon-open="../../assets/icons/mui-ten-len.svg" alt="">
                </button>

                <div class="user-header__menu" id="user-account-menu" role="menu" aria-label="Menu tài khoản" hidden>
                    <div class="user-header__menu-summary" data-menu-summary hidden>
                        <div class="user-header__menu-summary-heading">
                            <strong data-menu-summary-title>Tài khoản xác thực</strong>
                            <span class="user-header__menu-badge" data-menu-summary-badge>Gia sư TOP 1%</span>
                        </div>
                        <div class="user-header__menu-balance">
                            <span>Ví thù lao:</span>
                            <strong data-menu-balance>4.850.000đ</strong>
                        </div>
                    </div>

                    <div class="user-header__menu-section" data-menu-links>
                        <a class="user-header__menu-item" href="#ho-so" role="menuitem" data-menu-item="0">
                            <img class="user-header__menu-item-leading" src="../../assets/icons/profile.svg" alt="" data-menu-icon="profile">
                            <span data-menu-label>Hồ sơ cá nhân</span>
                            <img class="user-header__menu-item-chevron" src="../../assets/icons/chevron-right.svg" alt="">
                        </a>
                        <a class="user-header__menu-item" href="#hop-dong" role="menuitem" data-menu-item="1">
                            <img class="user-header__menu-item-leading" src="../../assets/icons/calendar.svg" alt="" data-menu-icon="calendar">
                            <span data-menu-label>Hợp đồng của tôi</span>
                            <img class="user-header__menu-item-chevron" src="../../assets/icons/chevron-right.svg" alt="">
                        </a>
                        <a class="user-header__menu-item" href="#vi-tri-thuc" role="menuitem" data-menu-item="2">
                            <img class="user-header__menu-item-leading" src="../../assets/icons/wallet.svg" alt="" data-menu-icon="wallet">
                            <span data-menu-label>Ví TriThức</span>
                            <img class="user-header__menu-item-chevron" src="../../assets/icons/chevron-right.svg" alt="">
                        </a>
                        <a class="user-header__menu-item" href="#bao-mat" role="menuitem" data-menu-item="3">
                            <img class="user-header__menu-item-leading" src="../../assets/icons/shield.svg" alt="" data-menu-icon="shield">
                            <span data-menu-label>Bảo mật tài khoản</span>
                            <img class="user-header__menu-item-chevron" src="../../assets/icons/chevron-right.svg" alt="">
                        </a>
                        <a class="user-header__menu-item" href="#lich-su-giao-dich" role="menuitem" data-menu-item="4">
                            <img class="user-header__menu-item-leading" src="../../assets/icons/receipt.svg" alt="" data-menu-icon="receipt">
                            <span data-menu-label>Lịch sử giao dịch &amp; Hóa đơn</span>
                            <img class="user-header__menu-item-chevron" src="../../assets/icons/chevron-right.svg" alt="">
                        </a>
                    </div>

                    <div class="user-header__menu-section user-header__menu-section--logout">
                        <button class="user-header__menu-item user-header__menu-item--danger" type="button" role="menuitem" data-user-action="logout">
                            <img class="user-header__menu-item-icon" src="../../assets/icons/dang-xuat.svg" alt="">
                            <span data-menu-logout-label>Đăng xuất tài khoản</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script src="../../js/core/user-header.js" defer></script>
</body>
</html>
