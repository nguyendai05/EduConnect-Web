<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>IconButton — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />
        <link rel="stylesheet" href="../../css/components/action/component-icon.css" />
        <link rel="stylesheet" href="../../css/components/action/button.css" />
        <link rel="stylesheet" href="../../css/components/action/icon-button.css" />
    </head>
    <body>
        <main class="icon-button-preview" aria-label="IconButton">
            <div class="icon-button-preview__row">
                <button
                    class="icon-button icon-button--ghost icon-button--small"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--ghost icon-button--medium"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--ghost icon-button--large"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--primary-soft icon-button--small"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--primary-soft icon-button--medium"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--primary-soft icon-button--large"
                    type="button"
                    aria-label="Tìm gia sư"
                    title="Tìm gia sư"
                >
                    <span
                        class="component-icon component-icon--search"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--danger-soft icon-button--small"
                    type="button"
                    aria-label="Đóng"
                    title="Đóng"
                >
                    <span
                        class="component-icon component-icon--close"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--danger-soft icon-button--medium"
                    type="button"
                    aria-label="Đóng"
                    title="Đóng"
                >
                    <span
                        class="component-icon component-icon--close"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--danger-soft icon-button--large"
                    type="button"
                    aria-label="Đóng"
                    title="Đóng"
                >
                    <span
                        class="component-icon component-icon--close"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--ghost icon-button--medium"
                    type="button"
                    aria-label="Không thể đóng"
                    title="Không thể đóng"
                    disabled
                >
                    <span
                        class="component-icon component-icon--close"
                        aria-hidden="true"
                    ></span></button
                ><button
                    class="icon-button icon-button--primary-soft"
                    type="button"
                    disabled
                    aria-busy="true"
                    aria-label="Đang tải"
                >
                    <span class="button__spinner" aria-hidden="true"></span></button
                ><button
                    class="icon-button icon-button--ghost icon-button--medium"
                    type="button"
                    aria-label="Lưu hồ sơ"
                    title="Lưu hồ sơ"
                    aria-pressed="false"
                >
                    <span class="component-icon component-icon--bookmark" aria-hidden="true"></span>
                </button>
            </div>
        </main>
    </body>
</html>
