<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Button — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />
        <link rel="stylesheet" href="../../css/components/action/component-icon.css" />
        <link rel="stylesheet" href="../../css/components/action/button.css" />
    </head>
    <body>
        <main class="button-preview" aria-label="Button">
            <div class="button-preview__row">
                <button class="button button--primary button--small" type="button">
                    Gửi lời mời</button
                ><button class="button button--primary button--medium" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--primary button--large" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--outline button--small" type="button">
                    Gửi lời mời</button
                ><button class="button button--outline button--medium" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--outline button--large" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--ghost button--small" type="button">
                    Gửi lời mời</button
                ><button class="button button--ghost button--medium" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--ghost button--large" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Gửi
                    lời mời</button
                ><button class="button button--danger button--small" type="button">
                    Hủy lời mời</button
                ><button class="button button--danger button--medium" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Hủy
                    lời mời</button
                ><button class="button button--danger button--large" type="button">
                    <span class="component-icon component-icon--arrow" aria-hidden="true"></span>Hủy
                    lời mời
                </button>
            </div>
            <div class="button-preview__row">
                <button class="button button--primary button--medium" type="button" disabled>
                    Tiếp tục</button
                ><button
                    class="button button--primary button--medium"
                    type="button"
                    disabled
                    aria-busy="true"
                >
                    <span class="button__spinner" aria-hidden="true"></span>Đang gửi</button
                ><button
                    class="button button--outline button--medium"
                    type="button"
                    aria-pressed="false"
                >
                    <span class="component-icon component-icon--bookmark" aria-hidden="true"></span
                    >Lưu hồ sơ</button
                ><button class="button button--outline button--medium" type="button">
                    Tiếp tục<span
                        class="component-icon component-icon--arrow"
                        aria-hidden="true"
                    ></span>
                </button>
            </div>
        </main>
    </body>
</html>
