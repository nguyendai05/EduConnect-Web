<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StatCard — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />
        <link rel="stylesheet" href="../../css/components/action/component-icon.css" />

        <link rel="stylesheet" href="../../css/components/feedback/badge.css" />

        <link rel="stylesheet" href="../../css/components/data-display/card.css" />

        <link rel="stylesheet" href="../../css/components/data-display/stat-card.css" />
    </head>
    <body>
        <main class="stat-card-preview" aria-label="StatCard">
            <div class="stat-card-preview__grid">
                <article class="stat-card stat-card--">
                    <div class="stat-card__header">
                        <span
                            class="component-icon component-icon--profile"
                            aria-hidden="true"
                        ></span
                        ><span class="badge badge--warning">Cần xử lý</span>
                    </div>
                    <h3 class="stat-card__label">Hồ sơ gia sư</h3>
                    <p class="stat-card__value">3 <span class="stat-card__unit">hồ sơ</span></p>
                    <p class="stat-card__description">Chờ xác minh chứng chỉ</p>
                </article>
                <article class="stat-card stat-card--">
                    <div class="stat-card__header">
                        <span class="component-icon component-icon--file" aria-hidden="true"></span
                        ><span class="badge badge--warning">Cần xử lý</span>
                    </div>
                    <h3 class="stat-card__label">Tin tìm gia sư</h3>
                    <p class="stat-card__value">5 <span class="stat-card__unit">yêu cầu</span></p>
                    <p class="stat-card__description">Chờ duyệt nội dung đăng</p>
                </article>
                <article class="stat-card stat-card--danger">
                    <div class="stat-card__header">
                        <span
                            class="component-icon component-icon--dispute"
                            aria-hidden="true"
                        ></span
                        ><span class="badge badge--danger">Cần xử lý</span>
                    </div>
                    <h3 class="stat-card__label">Báo cáo & tranh chấp</h3>
                    <p class="stat-card__value">2 <span class="stat-card__unit">vụ việc</span></p>
                    <p class="stat-card__description">Cần xử lý yêu cầu hoàn tiền</p>
                </article>
                <article class="stat-card stat-card--warning">
                    <div class="stat-card__header">
                        <span
                            class="component-icon component-icon--wallet"
                            aria-hidden="true"
                        ></span
                        ><span class="badge badge--warning">Cần xử lý</span>
                    </div>
                    <h3 class="stat-card__label">Yêu cầu rút tiền</h3>
                    <p class="stat-card__value">1 <span class="stat-card__unit">yêu cầu</span></p>
                    <p class="stat-card__description">Chờ xử lý rút tiền từ ví</p>
                </article>
            </div>
        </main>
    </body>
</html>
