<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>InfoRow — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />

        <link rel="stylesheet" href="../../css/components/data-display/info-row.css" />
    </head>
    <body>
        <main class="info-row-preview" aria-label="InfoRow">
            <dl class="info-row">
                <dt class="info-row__label">Môn giảng dạy</dt>
                <dd class="info-row__value">Toán học</dd>
            </dl>
            <dl class="info-row">
                <dt class="info-row__label">Học phí</dt>
                <dd class="info-row__value">220.000 ₫/buổi</dd>
            </dl>
            <dl class="info-row info-row--stacked">
                <dt class="info-row__label">Kinh nghiệm</dt>
                <dd class="info-row__value">5 năm giảng dạy</dd>
            </dl>
            <dl class="info-row info-row--compact">
                <dt class="info-row__label">Tỷ lệ hài lòng</dt>
                <dd class="info-row__value">98%</dd>
            </dl>
        </main>
    </body>
</html>
