<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FileAttachmentItem — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />
        <link rel="stylesheet" href="../../css/components/action/component-icon.css" />
        <link rel="stylesheet" href="../../css/components/action/button.css" />

        <link rel="stylesheet" href="../../css/components/feedback/badge.css" />

        <link rel="stylesheet" href="../../css/components/data-display/file-attachment-item.css" />
    </head>
    <body>
        <main class="file-attachment-item-preview" aria-label="FileAttachmentItem">
            <article class="file-attachment-item">
                <div class="file-attachment-item__symbol">
                    <span class="component-icon component-icon--file" aria-hidden="true"></span>
                </div>
                <div class="file-attachment-item__body">
                    <h3 class="file-attachment-item__name">Tài liệu bằng cấp mẫu.txt</h3>
                    <span class="badge badge--success">Đã duyệt</span>
                    <p class="file-attachment-item__meta">Tài liệu mẫu · Tệp văn bản</p>
                </div>
                <div class="file-attachment-item__actions">
                    <a
                        class="button button--outline button--small"
                        href="../../assets/documents/component-certificate.txt"
                        target="_blank"
                        rel="noopener"
                        ><span class="component-icon component-icon--eye" aria-hidden="true"></span
                        >Xem</a
                    ><a
                        class="button button--ghost button--small"
                        href="../../assets/documents/component-certificate.txt"
                        download="tai-lieu-mau.txt"
                        ><span
                            class="component-icon component-icon--download"
                            aria-hidden="true"
                        ></span
                        >Tải xuống</a
                    >
                </div>
            </article>
            <article class="file-attachment-item">
                <div class="file-attachment-item__symbol">
                    <span class="component-icon component-icon--file" aria-hidden="true"></span>
                </div>
                <div class="file-attachment-item__body">
                    <h3 class="file-attachment-item__name">Tài liệu chứng chỉ mẫu.txt</h3>
                    <span class="badge badge--warning">Chờ duyệt</span>
                    <p class="file-attachment-item__meta">Tài liệu mẫu · Tệp văn bản</p>
                </div>
                <div class="file-attachment-item__actions">
                    <a
                        class="button button--outline button--small"
                        href="../../assets/documents/component-certificate.txt"
                        target="_blank"
                        rel="noopener"
                        ><span class="component-icon component-icon--eye" aria-hidden="true"></span
                        >Xem</a
                    ><a
                        class="button button--ghost button--small"
                        href="../../assets/documents/component-certificate.txt"
                        download="tai-lieu-mau.txt"
                        ><span
                            class="component-icon component-icon--download"
                            aria-hidden="true"
                        ></span
                        >Tải xuống</a
                    >
                </div>
            </article>
        </main>
    </body>
</html>
