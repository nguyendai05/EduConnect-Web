<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rating — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />

        <link rel="stylesheet" href="../../css/components/data-display/rating.css" />
    </head>
    <body>
        <main class="rating-preview" aria-label="Rating">
            <div class="rating-preview__row">
                <span
                    class="rating"
                    role="img"
                    aria-label="Đánh giá 4,5 trên 5 sao, 26 lượt đánh giá"
                    ><span class="rating__stars" aria-hidden="true"
                        ><span class="rating__star"></span><span class="rating__star"></span
                        ><span class="rating__star"></span><span class="rating__star"></span
                        ><span class="rating__star rating__star--half"></span></span
                    ><span class="rating__score" aria-hidden="true">4,5</span
                    ><span class="rating__count" aria-hidden="true">(26 đánh giá)</span></span
                ><span
                    class="rating rating--compact"
                    role="img"
                    aria-label="Đánh giá 4,5 trên 5 sao, 26 lượt đánh giá"
                    ><span class="rating__stars" aria-hidden="true"
                        ><span class="rating__star"></span></span
                    ><span class="rating__score" aria-hidden="true">4,5</span></span
                ><span class="rating__count">Chưa có đánh giá</span>
            </div>
        </main>
    </body>
</html>
