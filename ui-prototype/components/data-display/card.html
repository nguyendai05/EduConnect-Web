<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />

        <link rel="stylesheet" href="../../css/components/feedback/badge.css" />

        <link rel="stylesheet" href="../../css/components/data-display/card.css" />
    </head>
    <body>
        <main class="card-preview" aria-label="Card">
            <div class="card-preview__grid">
                <article class="card">
                    <div class="card__header"><h3 class="card__title">Lớp Toán 12</h3></div>
                    <div class="card__body"><p>Học trực tuyến cùng gia sư.</p></div>
                    <div class="card__footer">
                        <span class="badge badge--success">Đang mở</span>
                    </div>
                </article>
                <article class="card card--selected">
                    <div class="card__header"><h3 class="card__title">Gia sư đã chọn</h3></div>
                    <div class="card__body"><p>Theo dõi nội dung đã thống nhất.</p></div>
                    <div class="card__footer">
                        <span class="badge badge--success">Đã chọn</span>
                    </div>
                </article>
                <article class="card card--highlighted">
                    <div class="card__header"><h3 class="card__title">Luyện thi đại học</h3></div>
                    <div class="card__body"><p>Lộ trình học theo mục tiêu.</p></div>
                    <div class="card__footer">
                        <span class="badge badge--success">Đề xuất</span>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
