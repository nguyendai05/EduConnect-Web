<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Badge — Edu Connect</title>
        <link rel="stylesheet" href="../../css/tokens.css" />
        <link rel="stylesheet" href="../../css/reset.css" />
        <link rel="stylesheet" href="../../css/base.css" />
        <link rel="stylesheet" href="../../css/components/action/component-icon.css" />

        <link rel="stylesheet" href="../../css/components/feedback/badge.css" />
    </head>
    <body>
        <main class="badge-preview" aria-label="Badge">
            <div class="badge-preview__row">
                <span class="badge badge--verified"
                    ><span class="component-icon component-icon--verified" aria-hidden="true"></span
                    >Đã xác minh</span
                ><span class="badge badge--success"
                    ><span class="component-icon component-icon--check" aria-hidden="true"></span
                    >Đang mở</span
                ><span class="badge badge--warning"
                    ><span class="component-icon component-icon--clock" aria-hidden="true"></span
                    >Chờ duyệt</span
                ><span class="badge badge--info"
                    ><span class="component-icon component-icon--profile" aria-hidden="true"></span
                    >Đang tuyển</span
                ><span class="badge badge--danger"
                    ><span class="component-icon component-icon--close" aria-hidden="true"></span>Đã
                    hủy</span
                ><span class="badge badge--neutral"
                    ><span class="component-icon component-icon--file" aria-hidden="true"></span>Bản
                    nháp</span
                ><span class="badge badge--escrow"
                    ><span class="component-icon component-icon--wallet" aria-hidden="true"></span
                    >Đã ký quỹ</span
                >
            </div>
        </main>
    </body>
</html>
