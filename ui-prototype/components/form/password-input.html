<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PasswordInput</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components/form/password-input.css">
</head>
<body class="password-input-preview">
<main class="password-input-demo" aria-labelledby="password-input-demo-title">
    <header class="password-input-demo__header">
        <div>
            <h1 id="password-input-demo-title">3. PasswordInput</h1>
            <p>Nút ẩn/hiện mật khẩu với icon Eye/EyeOff 20px và vùng bấm 40×40px.</p>
        </div>
        <code>password-input</code>
    </header>

    <section class="password-input-demo__content" aria-label="Các trạng thái PasswordInput">
        <div class="password-field" data-component="password-input">
            <label class="password-field__label" for="password-hidden">Mật khẩu (Ẩn)</label>
            <div class="password-control">
                <input
                    class="password-control__input"
                    id="password-hidden"
                    name="passwordHidden"
                    type="password"
                    value=""
                    autocomplete="current-password"
                >
                <button
                    class="password-control__toggle"
                    type="button"
                    aria-label="Hiện mật khẩu"
                    aria-controls="password-hidden"
                    aria-pressed="false"
                    data-password-toggle
                >
                    <img
                        src="../../assets/icons/mat.svg"
                        data-icon-show="../../assets/icons/mat.svg"
                        data-icon-hide="../../assets/icons/mat-tat.svg"
                        alt=""
                    >
                </button>
            </div>
        </div>

        <div class="password-field" data-component="password-input">
            <label class="password-field__label" for="password-visible">Mật khẩu (Hiển thị)</label>
            <div class="password-control">
                <input
                    class="password-control__input password-control__input--visible"
                    id="password-visible"
                    name="passwordVisible"
                    type="text"
                    value="TriThuc@2026Pass"
                    autocomplete="off"
                >
                <button
                    class="password-control__toggle"
                    type="button"
                    aria-label="Ẩn mật khẩu"
                    aria-controls="password-visible"
                    aria-pressed="true"
                    data-password-toggle
                >
                    <img
                        src="../../assets/icons/mat-tat.svg"
                        data-icon-show="../../assets/icons/mat.svg"
                        data-icon-hide="../../assets/icons/mat-tat.svg"
                        alt=""
                    >
                </button>
            </div>
        </div>

        <p class="password-input-demo__help">
            Bật/tắt không làm xóa giá trị hoặc kích hoạt gửi form.
        </p>
    </section>
</main>
<script src="../../js/core/password-input.js" defer></script>
</body>
</html>
